      - run:
          name: Fetch checkpoint shard
          command: |
            : > resnet50.ckpt
      - run:
          name: Build inference graph
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ResnetProbe -j2
      - run:
          name: Probe layer activations
          command: LIONSS_LP=1 ./build/ResnetProbe --ckpt resnet50.ckpt --layer layer3
